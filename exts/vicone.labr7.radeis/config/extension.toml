[package]
name = "vicone.labr7.radeis"
title = "In-Sim Physical AI Safety Validator"
version = "0.2.2"
category = "simulation"
description = "Systematically red-team your VLM/VLA policy's behavior before you ship."
authors = ["LabR7"]
icon = "data/icon/lab-r7-logo.png"
preview_image = "docs/radeis_youtube_cover_1280x720.png"
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
repository = "https://github.com/VicOne-OSS-TW/labr7-radeis-InSimPhysicalAI"
keywords = ["adversarial", "robustness", "red team", "robotics", "VLM", "VLA", "attention", "gemma"]

[package.writeTarget]
kit = true
python = false

# Minimal hard deps so the extension always LOADS. IsaacSim camera / Spot
# policy / experimental-core modules are imported lazily inside methods (they
# are present in the full Isaac Sim 6.0 app) so a bare Kit still loads the panel.
[dependencies]
"omni.ui" = {}
"omni.usd" = {}
"omni.timeline" = {}
"omni.kit.menu.utils" = {}
"omni.kit.pipapi" = {}

[[python.module]]
name = "vicone.labr7.radeis"
path = "."

[settings]
exts."vicone.labr7.radeis".sidecar_url = "http://127.0.0.1:8765"
exts."vicone.labr7.radeis".default_model = "gemma-4-e2b-it"
exts."vicone.labr7.radeis".dwell_seconds = 3.0
exts."vicone.labr7.radeis".traj_bias_K = 0.5

# --- usage telemetry (see docs/README.md "Telemetry & Privacy" + TELEMETRY.md) ---
exts."vicone.labr7.radeis".telemetry_enabled = true
# Apps Script Web App /exec URL + PUBLIC write token. NOT secret: the token is
# anti-spam only and ships in the client by design. The SECRET read token is
# NEVER placed here (it lives only in the owner's RADEIS_READ_TOKEN env var).
exts."vicone.labr7.radeis".telemetry_url = "https://script.google.com/macros/s/AKfycbzzX31FjSGRaF3gdxwsSHir_Q2VsYXiP0cpQ9QB231sG2Dkh0PW24K7ExmlmGUkNNpP/exec"
exts."vicone.labr7.radeis".telemetry_token = "r0d1s-s0f7i-v1"
