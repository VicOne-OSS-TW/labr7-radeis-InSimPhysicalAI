name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # data/scenes/** is stored in Git LFS; without this the ZIP would ship
          # LFS pointer files instead of the USD scenes and textures.
          lfs: true

      - name: Build release artifacts
        run: bash build_package.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
          generate_release_notes: true
